<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="경기장과 시범으로 배우는 초등 체육 교실">
<title>체육 교실</title>
<link rel="stylesheet" href="./style.css?v=1.4.2">
<link rel="stylesheet" href="./sports.css?v=1.4.2">
<link rel="stylesheet" href="./teams-shell.css?v=1.4.2">
<script defer src="./sports.js?v=1.4.2"></script>
<script defer src="./app.js?v=1.4.2"></script>
<script defer src="./ultimate.js?v=1.4.2"></script>
<script defer src="./teams-shell.js?v=1.4.2"></script>
</head>
<body>
<div class="sports-layout">
<aside class="sport-rail" aria-labelledby="sports-title">
  <div class="pe-brand"><strong id="sports-title">체육 교실</strong><span>PE CLASS</span></div>
  <nav class="sport-list" aria-label="스포츠 종목">
    <a class="sport-pick racket" id="pick-badminton" href="#court" aria-current="true">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <g id="shuttlecock-icon" transform="rotate(38 20 20)" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 25 7 9q3-4 7-2 3-4 6-1 3-3 6 1 4-2 7 2l-8 16z"/>
          <path d="m14 7 3.5 18M20 6v19m6-18-3.5 18M15 25v4a5 5 0 0 0 10 0v-4M15 28h10"/>
        </g>
      </svg>
      <span>배드민턴</span>
    </a>
    <a class="sport-pick disc" id="pick-ultimate" href="#ultimate/field">
      <svg viewBox="0 0 40 40" aria-hidden="true"><ellipse cx="22" cy="17" rx="14" ry="6" transform="rotate(-20 22 17)"/><path d="M10 22c3 6 22 1 26-6M4 26h7m-7 5h13"/></svg>
      <span>플라잉디스크<br>얼티밋</span>
    </a>
  </nav>
  <nav class="team-navigation" aria-label="팀 및 대진 관리">
    <a class="sport-pick team-pick" id="pick-teams" href="#teams"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="12" r="5"/><circle cx="7" cy="18" r="4"/><circle cx="33" cy="18" r="4"/><path d="M11 33v-5a9 9 0 0 1 18 0v5M1 34v-5a6 6 0 0 1 9-5m20 0a6 6 0 0 1 9 5v5"/></svg><span>팀편성</span></a>
    <a class="sport-pick team-pick" id="pick-fixtures" href="#fixtures"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M5 7h7v10H5m0 6h7v10H5m7-21h9v16h-9m9-8h13"/></svg><span>대진편성</span></a>
  </nav>
</aside>
<div class="shell sport-panel" id="badminton-panel">
  <header class="masthead">
    <a class="brand" href="#court" aria-label="배드민턴 첫 화면">
      <span class="symbol" aria-hidden="true"><svg viewBox="0 0 40 40"><use href="#shuttlecock-icon"/></svg></span>
      <span>배드민턴</span>
    </a>
    <button id="sound" class="sound" type="button" aria-pressed="false"></button>
  </header>
  <nav id="nav" class="chapters" aria-label="학습 주제"></nav>
  <main class="lesson" id="lesson">
    <section class="lesson-copy" aria-labelledby="heading">
      <div class="lesson-heading">
        <div>
          <h1 id="heading"></h1>
          <p class="lead" id="lead"></p>
        </div>
        <div class="setting"><span id="match-label">경기 방식</span><div id="match" class="segments" role="group" aria-labelledby="match-label"></div></div>
      </div>
      <div class="lesson-toolbar">
        <div class="controls" id="controls"></div>
        <div class="action-row" id="actions"></div>
      </div>
      <div class="insight" id="insight" role="status" aria-live="polite"></div>
    </section>
    <section class="demo" aria-label="코트와 시범">
      <header class="demo-header"><span class="demo-index" id="demo-index"></span><span class="mode-note" id="demo-note"></span></header>
      <div id="visual" class="visual"></div>
      <div class="demo-footer" id="demo-footer"></div>
    </section>
  </main>
  <footer class="footer">
    <a href="https://www.badminton.no/contentassets/c0b5fd676d9a4a10bd7a14c673a7bad0/section-4.1---laws-of-badminton---26-april-2025-v5.0-1--1.pdf" target="_blank" rel="noopener">경기 규칙 출처 ↗</a>
  </footer>
</div>
<div class="shell sport-panel ultimate-panel" id="ultimate-panel" hidden>
  <header class="masthead">
    <a class="brand" href="#ultimate/field"><span class="symbol" aria-hidden="true">
      <svg viewBox="0 0 40 40"><ellipse cx="21" cy="19" rx="14" ry="6" transform="rotate(-20 21 19)"/><path d="M9 24c3 6 22 1 26-6m-31 12h11"/></svg>
    </span>플라잉디스크 얼티밋</a>
  </header>
  <nav class="chapters" id="ultimate-nav" aria-label="얼티밋 학습 주제"></nav>
  <main class="lesson" id="ultimate-lesson">
    <section class="lesson-copy" aria-labelledby="ultimate-heading">
      <div class="lesson-heading"><div><h1 id="ultimate-heading"></h1><p class="lead" id="ultimate-lead"></p></div></div>
      <div class="lesson-toolbar">
        <div class="controls" id="ultimate-controls"></div>
        <div class="action-row" id="ultimate-actions"></div>
      </div>
      <div class="insight" id="ultimate-insight" role="status"></div>
    </section>
    <section class="demo" aria-label="필드와 경기 시범">
      <header class="demo-header"><span class="demo-index" id="ultimate-demo-index"></span><span class="mode-note" id="ultimate-result"></span></header>
      <div class="visual ultimate-visual" id="ultimate-visual"></div>
      <div class="demo-footer" id="ultimate-caption"></div>
    </section>
  </main>
  <footer class="footer">
    <span>수업 자료 · 플라잉디스크 얼티밋 경기 규칙</span>
    <a href="https://rules.wfdf.sport/" target="_blank" rel="noopener">WFDF 공식 규칙 ↗</a>
  </footer>
</div>
<section class="sport-panel team-host" id="teams-panel" aria-label="팀 및 대진 관리" hidden></section>
<footer class="sport-credit"><span class="credit"><img src="./giri.png" alt="" width="28" height="28"><span>기리공작소</span><span class="version" id="site-version">v1.4.2</span></span></footer>
</div>
</body>
</html>
